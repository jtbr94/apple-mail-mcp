<body class="text-page">

<header class="nav">
  <a class="logo" href="/" aria-label="Sahkō home">Sahkō</a>
  <p class="date" data-date></p>
  <div class="nav-right">
    <nav class="links" id="primary-nav" aria-label="Primary"><a href="/" >Collection</a><a href="/about/" >About</a><a href="/wholesale/" >Wholesale</a><a href="/contact/" aria-current="page">Contact</a></nav>
    <button type="button" class="theme" data-theme-toggle aria-label="Switch to dark theme" title="Theme"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor" stroke="none"/></svg></button>

  </div>
</header>
<main id="main">

<article class="page">
  <header class="page-head"><p class="eyebrow"><span class="macron" aria-hidden="true"></span>Contact</p><h1 class="display">Say hello.</h1></header>
  
<form class="inquiry" data-inquiry data-kind="contact" novalidate>
  <div class="field"><label for="contact-name">Name</label><input id="contact-name" name="name" autocomplete="name" required></div>
  
  <div class="field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label for="contact-location">Location <span class="muted">optional</span></label><input id="contact-location" name="location" autocomplete="address-level2"></div>
  
  <div class="field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="5" required></textarea></div>
  <div class="field hp" aria-hidden="true"><label for="contact-website">Website</label><input id="contact-website" name="website" tabindex="-1" autocomplete="off"></div>
  <p class="muted small">We use what you send only to reply to you. Nothing is shared or added to a list.</p>
  <div class="preorder-row"><button type="submit" class="button">Send</button><p class="form-status" role="status" aria-live="polite"></p></div>
</form>
<p class="muted">Or write to <a href="mailto:hello@sahkocoffee.com">hello@sahkocoffee.com</a>.</p>
</article>
</main>

<script src="/assets/site.js" defer></script>
</body>
